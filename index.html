<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Portfolio of Martin Louie Sobrino, a full-stack engineer building maintainable web systems with PHP, Node.js, React, and MySQL."
  />
  <title>Martin Louie Sobrino | Full-Stack Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #06131a;
      --bg-deep: #030a10;
      --panel: rgba(10, 24, 34, 0.72);
      --panel-strong: rgba(12, 29, 40, 0.92);
      --text: #edf7fb;
      --muted: #9fb7c6;
      --line: rgba(173, 229, 255, 0.14);
      --aqua: #7ce9ff;
      --mint: #9bffb3;
      --peach: #ffc58d;
      --glow: 0 24px 80px rgba(8, 28, 41, 0.45);
      --radius: 24px;
      --container: min(1180px, calc(100vw - 32px));
      --nav-height: 84px;
      --mouse-x: 50%;
      --mouse-y: 50%;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(124, 233, 255, 0.14), transparent 32%),
        radial-gradient(circle at 85% 20%, rgba(155, 255, 179, 0.15), transparent 18%),
        linear-gradient(180deg, #0a1822 0%, var(--bg-deep) 42%, #040b11 100%);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 280px at var(--mouse-x) var(--mouse-y), rgba(124, 233, 255, 0.12), transparent 72%),
        linear-gradient(rgba(173, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(173, 229, 255, 0.03) 1px, transparent 1px);
      background-size: auto, 72px 72px, 72px 72px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.92), transparent 96%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .page-shell {
      position: relative;
      z-index: 1;
    }

    .container {
      width: var(--container);
      margin: 0 auto;
    }

    .loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(3, 10, 16, 0.92);
      backdrop-filter: blur(14px);
      z-index: 20;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-mark {
      display: grid;
      gap: 14px;
      justify-items: center;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 0.76rem;
    }

    .loader-ring {
      width: 82px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(124, 233, 255, 0.25);
      border-top-color: var(--aqua);
      animation: spin 1s linear infinite;
      box-shadow: 0 0 32px rgba(124, 233, 255, 0.2);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
      background: rgba(3, 10, 16, 0.55);
      border-bottom: 1px solid rgba(173, 229, 255, 0.08);
    }

    .site-nav {
      min-height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(124, 233, 255, 0.22), rgba(155, 255, 179, 0.22));
      border: 1px solid rgba(173, 229, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: var(--aqua);
    }

    .brand-name {
      font-size: 0.95rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-links a {
      position: relative;
      transition: color 0.2s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--aqua), var(--mint));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--text);
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
      transform: scaleX(1);
    }

    .availability-pill {
      padding: 0.72rem 1rem;
      border-radius: 999px;
      background: rgba(124, 233, 255, 0.08);
      border: 1px solid rgba(124, 233, 255, 0.16);
      color: var(--aqua);
      font-size: 0.84rem;
      white-space: nowrap;
    }

    main {
      padding-bottom: 48px;
    }

    section {
      padding: 28px 0;
    }

    .section-copy {
      max-width: none;
      margin-bottom: 24px;
    }

    .section-copy.full-width,
    .section-copy.full-width .lede {
      max-width: none;
    }

    .lede.justify {
      text-align: justify;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--aqua);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .eyebrow::before {
      content: "";
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, rgba(124, 233, 255, 0), rgba(124, 233, 255, 1));
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      font-family: "Syne", "Segoe UI", sans-serif;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6.4rem);
      max-width: 12ch;
    }

    h2 {
      font-size: clamp(2rem, 4vw, 3.4rem);
      max-width: none;
      margin-bottom: 16px;
    }

    h3 {
      font-size: 1.35rem;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .lede {
      max-width: none;
      font-size: 1.04rem;
    }

    .hero {
      min-height: calc(100vh - var(--nav-height));
      display: grid;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 68px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.95fr);
      gap: 32px;
      align-items: stretch;
    }

    .hero-copy {
      display: grid;
      gap: 22px;
      align-content: center;
    }

    .headline-wrap {
      display: grid;
      gap: 14px;
    }

    .headline-emphasis {
      color: var(--aqua);
      text-shadow: 0 0 28px rgba(124, 233, 255, 0.25);
    }

    .hero-actions,
    .social-row,
    .project-links,
    .contact-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--aqua), var(--mint));
      color: #041118;
      font-weight: 700;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      box-shadow: 0 14px 35px rgba(124, 233, 255, 0.18);
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 18px 42px rgba(124, 233, 255, 0.22);
    }

    .btn.secondary {
      background: rgba(124, 233, 255, 0.05);
      color: var(--text);
      border-color: rgba(124, 233, 255, 0.2);
      box-shadow: none;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .stat-card,
    .glass-card,
    .service-card,
    .project-card,
    .timeline-card,
    .testimonial-card,
    .blog-card,
    .contact-card,
    .stack-card,
    .study-card,
    .skill-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid rgba(173, 229, 255, 0.12);
      background: linear-gradient(180deg, rgba(15, 30, 42, 0.94), rgba(7, 18, 26, 0.82));
      box-shadow: var(--glow);
      backdrop-filter: blur(16px);
    }

    .stat-card {
      padding: 18px;
    }

    .stat-value {
      font-family: "Syne", sans-serif;
      font-size: 1.9rem;
      color: var(--text);
    }

    .hero-panel {
      position: relative;
      padding: 24px;
      display: grid;
      gap: 18px;
      min-height: 100%;
    }

    .hero-panel::before,
    .project-card::before,
    .service-card::before,
    .study-card::before,
    .timeline-card::before,
    .contact-card::before {
      content: "";
      position: absolute;
      inset: auto -20% 65% auto;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 233, 255, 0.18), transparent 68%);
      pointer-events: none;
    }

    .profile-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--peach);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .portrait {
      min-height: 280px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(9, 25, 35, 0.4), rgba(4, 12, 19, 0.88));
      border: 1px solid rgba(173, 229, 255, 0.14);
      position: relative;
      overflow: hidden;
    }

    .portrait::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 18px;
      border: 1px solid rgba(173, 229, 255, 0.12);
    }

    .portrait-image {
      width: 100%;
      height: 100%;
      min-height: 280px;
      object-fit: cover;
      object-position: center;
      border-radius: 22px;
    }

    .portrait-caption {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(3, 10, 16, 0.72);
      border: 1px solid rgba(173, 229, 255, 0.16);
      backdrop-filter: blur(6px);
    }

    .mini-panel {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .mini-stat {
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(173, 229, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .mini-stat strong {
      display: block;
      font-family: "Syne", sans-serif;
      font-size: 1.5rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .grid-2,
    .grid-3,
    .grid-4,
    .projects-grid,
    .stack-grid,
    .timeline-grid,
    .studies-grid,
    .blog-grid {
      display: grid;
      gap: 18px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3,
    .projects-grid,
    .blog-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-4,
    .stack-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .about-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
      gap: 18px;
      align-items: stretch;
    }

    .glass-card,
    .skill-card,
    .service-card,
    .stack-card,
    .project-card,
    .study-card,
    .timeline-card,
    .testimonial-card,
    .blog-card,
    .contact-card {
      padding: 24px;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .glass-card:hover,
    .skill-card:hover,
    .service-card:hover,
    .stack-card:hover,
    .project-card:hover,
    .study-card:hover,
    .timeline-card:hover,
    .testimonial-card:hover,
    .blog-card:hover,
    .contact-card:hover {
      transform: translateY(-4px);
      border-color: rgba(124, 233, 255, 0.28);
      box-shadow: 0 28px 80px rgba(5, 20, 30, 0.5);
    }

    .highlight-list,
    .service-points,
    .study-list,
    .contact-list,
    .footer-nav {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .highlight-list li,
    .service-points li,
    .study-list li,
    .contact-list li {
      display: flex;
      gap: 12px;
      color: var(--muted);
    }

    .highlight-list li::before,
    .service-points li::before,
    .study-list li::before,
    .contact-list li::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--aqua), var(--mint));
      margin-top: 0.55rem;
      flex: 0 0 auto;
      box-shadow: 0 0 18px rgba(124, 233, 255, 0.4);
    }

    .skill-card {
      display: grid;
      gap: 16px;
    }

    .skill-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--aqua), var(--mint));
      transform-origin: left;
      animation: loadBar 1.2s ease both;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.48rem 0.8rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(173, 229, 255, 0.08);
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1;
    }

    .service-card {
      display: grid;
      gap: 16px;
    }

    .service-icon,
    .stack-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(124, 233, 255, 0.08);
      border: 1px solid rgba(124, 233, 255, 0.14);
      color: var(--aqua);
      font-family: "Syne", sans-serif;
    }

    .stack-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(124, 233, 255, 0.25));
    }

    .stack-fallback {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .projects-grid {
      align-items: stretch;
    }

    .project-card {
      display: grid;
      gap: 18px;
    }

    .project-visual {
      min-height: 210px;
      border-radius: 20px;
      border: 1px solid rgba(173, 229, 255, 0.12);
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(124, 233, 255, 0.16), rgba(255, 197, 141, 0.08), rgba(155, 255, 179, 0.16));
    }

    .project-visual::before,
    .project-visual::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(2px);
      transition: transform 0.35s ease;
    }

    .project-visual::before {
      inset: 16% auto auto 12%;
      width: 58%;
      height: 58%;
      background: rgba(4, 17, 24, 0.76);
      border: 1px solid rgba(173, 229, 255, 0.18);
    }

    .project-visual::after {
      right: 10%;
      bottom: 12%;
      width: 36%;
      height: 20%;
      background: rgba(4, 17, 24, 0.92);
      border: 1px solid rgba(173, 229, 255, 0.14);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }

    .project-card:hover .project-visual::before {
      transform: translate3d(8px, -8px, 0);
    }

    .project-card:hover .project-visual::after {
      transform: translate3d(-10px, 8px, 0);
    }

    .project-meta,
    .study-metrics,
    .testimonial-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem 0.72rem;
      border-radius: 999px;
      background: rgba(124, 233, 255, 0.07);
      border: 1px solid rgba(124, 233, 255, 0.14);
      color: var(--aqua);
      font-size: 0.83rem;
      line-height: 1;
    }

    .study-card,
    .timeline-card,
    .blog-card {
      display: grid;
      gap: 18px;
    }

    .metric-block {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(173, 229, 255, 0.1);
      min-width: 120px;
    }

    .metric-block strong {
      display: block;
      font-size: 1.5rem;
      font-family: "Syne", sans-serif;
      color: var(--text);
      margin-bottom: 4px;
    }

    .timeline-card details {
      border-top: 1px solid rgba(173, 229, 255, 0.1);
      padding-top: 16px;
    }

    .timeline-card summary {
      cursor: pointer;
      color: var(--text);
      font-weight: 600;
      list-style: none;
    }

    .timeline-card summary::-webkit-details-marker {
      display: none;
    }

    .testimonial-stage {
      position: relative;
      min-height: 280px;
    }

    .testimonial-card {
      position: absolute;
      inset: 0;
      display: grid;
      gap: 18px;
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .testimonial-card.is-active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    blockquote {
      margin: 0;
      font-size: 1.05rem;
      color: var(--text);
    }

    .quote-mark {
      font-family: "Syne", sans-serif;
      font-size: 3rem;
      line-height: 0.85;
      color: rgba(124, 233, 255, 0.3);
    }

    .testimonial-dots {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      background: rgba(173, 229, 255, 0.18);
      padding: 0;
      cursor: pointer;
    }

    .dot.is-active {
      background: linear-gradient(135deg, var(--aqua), var(--mint));
      box-shadow: 0 0 18px rgba(124, 233, 255, 0.42);
    }

    .stack-card {
      display: grid;
      gap: 14px;
      justify-items: start;
    }

    .blog-card small,
    .timeline-meta,
    .muted-label {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .contact-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
      gap: 18px;
    }

    .contact-form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 18px;
      border: 1px solid rgba(173, 229, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: rgba(124, 233, 255, 0.42);
      box-shadow: 0 0 0 4px rgba(124, 233, 255, 0.1);
      transform: translateY(-1px);
    }

    .form-note {
      min-height: 24px;
      color: var(--aqua);
      font-size: 0.92rem;
    }

    .contact-chip {
      padding: 0.7rem 0.92rem;
      border-radius: 999px;
      border: 1px solid rgba(173, 229, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
    }

    .social-list {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      border: 1px solid rgba(173, 229, 255, 0.14);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    }

          const node = ref.current;

          if (!node) {
            return undefined;
          }

          const observer = new IntersectionObserver(
            entries => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  node.classList.add("is-visible");
                  observer.unobserve(node);
                }
              });
            },
            { threshold: 0.16 }
          );

          observer.observe(node);

          return () => observer.disconnect();
        }, []);

        return ref;

      function ProjectsSection() {
        const ref = useReveal();
        const [activeProject, setActiveProject] = useState(null);
        const [activeImageIndex, setActiveImageIndex] = useState(0);
        const modalRef = useRef(null);
        const closeButtonRef = useRef(null);
        const lastFocusedElementRef = useRef(null);

        useEffect(() => {
          if (!activeProject) {
            return undefined;
          }

          function handleEsc(event) {
            if (event.key === "Escape") {
              closeProjectSamples();
            }
          }

          window.addEventListener("keydown", handleEsc);

          return () => window.removeEventListener("keydown", handleEsc);
        }, [activeProject]);

        useEffect(() => {
          if (activeProject) {
            const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
            document.body.style.overflow = "hidden";
            if (scrollbarWidth > 0) {
              document.body.style.paddingRight = `${scrollbarWidth}px`;
            }

            if (closeButtonRef.current) {
              closeButtonRef.current.focus();
            } else if (modalRef.current) {
              modalRef.current.focus();
            }

            return () => {
              document.body.style.overflow = "";
              document.body.style.paddingRight = "";
            };
          }
        }, [activeProject]);

        function openProjectSamples(project) {
          lastFocusedElementRef.current = document.activeElement;
          setActiveProject(project);
          setActiveImageIndex(0);
        }

        function closeProjectSamples() {
          const previousFocus = lastFocusedElementRef.current;
          setActiveProject(null);
          setActiveImageIndex(0);

          window.setTimeout(() => {
            if (previousFocus && typeof previousFocus.focus === "function") {
              previousFocus.focus();
            }
          }, 0);
        }

        const activeImage =
          activeProject && activeProject.sampleImages
            ? activeProject.sampleImages[activeImageIndex]
            : null;

        return e(
          Fragment,
          null,
          e(
            "section",
            { id: "projects" },
            e(
              "div",
              { className: "container reveal", ref },
              e(SectionHeader, {
                eyebrow: "Featured Projects",
                title: "Selected systems delivered for real operations.",
                text: "Each project highlights full-stack delivery with emphasis on process improvement, reporting support, and day-to-day reliability."
              }),
              e(
                "div",
                { className: "projects-grid" },
                projects.map(project =>
                  e(
                    "article",
                    { className: "project-card", key: project.title },
                    e(
                      "div",
                      { className: "project-meta" },
                      project.tags.map(tag =>
                        e("span", { className: "meta-chip", key: tag }, tag)
                      )
                    ),
                    e("h3", null, project.title),
                    e("p", null, project.summary),
                    e(
                      "div",
                      { className: "project-links" },
                      project.links.map(link =>
                        e("a", { className: "btn secondary", key: link.label, href: link.href }, link.label)
                      ),
                      project.sampleImages && project.sampleImages.length > 0
                        ? e(
                            "button",
                            {
                              type: "button",
                              className: "btn secondary",
                              onClick: () => openProjectSamples(project)
                            },
                            "View Sample"
                          )
                        : null
                    )
                  )
                )
              )
            )
          ),
          activeProject && activeImage
            ? e(
                "div",
                {
                  className: "project-modal-backdrop",
                  onClick: closeProjectSamples
                },
                e(
                  "div",
                  {
                    className: "project-modal",
                    role: "dialog",
                    "aria-modal": "true",
                    "aria-label": `${activeProject.title} sample images`,
                    tabIndex: -1,
                    ref: modalRef,
                    onClick: event => event.stopPropagation()
                  },
                  e(
                    "div",
                    { className: "project-modal-head" },
                    e("h3", null, `${activeProject.title} Samples`),
                    e(
                      "button",
                      {
                        type: "button",
                        className: "project-modal-close",
                        ref: closeButtonRef,
                        onClick: closeProjectSamples,
                        "aria-label": "Close sample window"
                      },
                      "X"
                    )
                  ),
                  e(
                    "div",
                    { className: "project-modal-stage" },
                    e("img", {
                      className: "project-modal-image",
                      src: activeImage,
                      alt: `${activeProject.title} sample ${activeImageIndex + 1}`
                    })
                  ),
                  activeProject.sampleImages.length > 1
                    ? e(
                        "div",
                        { className: "project-modal-thumbs" },
                        activeProject.sampleImages.map((imagePath, index) =>
                          e(
                            "button",
                            {
                              type: "button",
                              className: `project-thumb${activeImageIndex === index ? " is-active" : ""}`,
                              key: imagePath,
                              onClick: () => setActiveImageIndex(index),
                              "aria-label": `View sample image ${index + 1}`
                            },
                            e("img", { src: imagePath, alt: `${activeProject.title} thumbnail ${index + 1}` })
                          )
                        )
                      )
                    : null
                )
              )
            : null
        );
      }

      function App() {
        const [isLoaded, setIsLoaded] = useState(false);

        useEffect(() => {
          const timerId = window.setTimeout(() => {
            setIsLoaded(true);
          }, 550);

          return () => window.clearTimeout(timerId);
        }, []);

        useEffect(() => {
          function handlePointerMove(event) {
            document.documentElement.style.setProperty("--mouse-x", `${event.clientX}px`);
            document.documentElement.style.setProperty("--mouse-y", `${event.clientY}px`);
          }

          window.addEventListener("pointermove", handlePointerMove, { passive: true });

          return () => window.removeEventListener("pointermove", handlePointerMove);
        }, []);

        return e(
          Fragment,
          null,
          e(
            "div",
            { className: `loader${isLoaded ? " is-hidden" : ""}`, "aria-hidden": isLoaded ? "true" : "false" },
            e(
              "div",
              { className: "loader-mark" },
              e("div", { className: "loader-ring" }),
              e("div", null, "Initializing portfolio")
            )
          ),
          e(

              e(StackSkillsSection),
              e(InsightsSection),
              e(ContactSection)
            ),
            e(Footer)
          )
        );
      }
